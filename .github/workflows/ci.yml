
#  automatic PR creation
name: CI

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  create-pr:
    name: Create Pull Request
    needs: [frontend, rust]
    if: github.ref == 'refs/heads/test-ci'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Create PR if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          AHEAD_BY=$(gh api \
            "repos/$GH_REPO/compare/main...test-ci" \
            --jq '.ahead_by')

          if [ "$AHEAD_BY" -eq 0 ]; then
            echo "No new commits between test-ci and main. PR is not needed."
            exit 0
          fi

          EXISTING_PR=$(gh pr list \
            --head test-ci \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull Request #$EXISTING_PR already exists."
          else
            gh pr create \
              --base main \
              --head test-ci \
              --title "Merge test-ci into main" \
              --body "Automated Pull Request created after successful CI."
          fi
